[package]
name = "atari-cx40-ble"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Atari CX40 BLE HID implementation using Embassy Trouble on RP2040"
license.workspace = true

[features]
default = []
skip-cyw43-firmware = []

[dependencies]
embassy-executor = { version = "0.10.0", features = ["executor-thread", "executor-interrupt", "platform-cortex-m", "defmt"] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["boot2-w25q080", "critical-section-impl", "defmt", "rp2040", "time-driver"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-128", "security"] }
bt-hci = "0.8.1"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.1"
portable-atomic = { version = "1.15", features = ["critical-section"] }
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
